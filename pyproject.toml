[project]
name = "pakka"
version = "0.1.0"
description = "Evidence-gated actions for speech-to-speech voice agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=1.60",
  "websockets>=14",
  "pydantic>=2.8",
  "httpx>=0.27",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "soxr>=0.5",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.8", "pyright>=1.1.390", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pakka"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["g0"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "eval", "scripts", "main.py"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
