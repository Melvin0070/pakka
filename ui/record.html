<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pramaan: record a caller</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400..700&family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=22">
<style>
  .rec { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
  .rec h1 { font-size: 24px; font-weight: 500; margin: 0 0 8px; }
  .rec p { color: var(--ink-2); margin: 0 0 16px; }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin-top: 24px; }
  .say { font-size: 32px; line-height: 1.35; font-weight: 500; margin: 12px 0 24px; min-height: 2.7em; }
  .meta { font-size: 14px; color: var(--ink-3); display: flex; justify-content: space-between; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .rec input[type=text] { font: inherit; height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; width: 160px; }
  .btn { height: 44px; padding: 0 20px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); cursor: pointer; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.live { background: var(--doubt); color: #fff; border-color: var(--doubt); }
  .btn:disabled { opacity: .4; cursor: default; }
  .note { font-size: 14px; margin-top: 16px; min-height: 1.5em; }
  .note.bad { color: var(--doubt); }
  label.consent { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink-2); margin: 16px 0; }
  meter { width: 100%; height: 8px; margin-top: 16px; }
</style>
</head>
<body>
<main class="rec">
  <h1>Record a caller</h1>
  <p>You will read 17 short lines the way you would say them on a phone call, then answer 5 quick questions in your own words. About five minutes.</p>

  <section class="card" id="intro">
    <div class="row">
      <input type="text" id="speaker" placeholder="Code, e.g. p01" autocomplete="off" aria-label="Speaker code">
      <button class="btn primary" id="begin" disabled>Begin</button>
    </div>
    <label class="consent"><input type="checkbox" id="consent">
      I agree that my voice recordings are stored on this laptop and sent to speech recognition services
      (OpenAI, Sarvam, VerbX) to measure their accuracy. Use a code, not your name. The numbers on screen are
      made up: do not say your real phone, PIN or account number.</label>
    <div class="note" id="introNote"></div>
  </section>

  <section class="card" id="stage" hidden>
    <div class="meta"><span id="count"></span><span id="who"></span></div>
    <p id="cue" hidden></p>
    <div class="say" id="say" lang="hi"></div>
    <div class="row">
      <button class="btn primary" id="rec">Record (space)</button>
      <button class="btn" id="play" disabled>Listen</button>
      <button class="btn" id="save" disabled>Save and next (enter)</button>
    </div>
    <meter id="level" min="0" max="1" value="0"></meter>
    <div class="note" id="note">Read it once in your normal voice. Do not slow down for the numbers.</div>
  </section>

  <section class="card" id="done" hidden>
    <div class="say">Done. Thank you.</div>
    <p id="totals"></p>
    <button class="btn" onclick="location.reload()">Next speaker</button>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let speaker = '', queue = [], total = 0, ctx, node, chunks = [], recording = false, wav = null;

const ready = () => { $('begin').disabled = !(/^[a-z0-9]{2,12}$/.test($('speaker').value.trim()) && $('consent').checked); };
$('speaker').oninput = ready; $('consent').onchange = ready;

$('begin').onclick = async () => {
  speaker = $('speaker').value.trim();
  const r = await fetch('/api/record/prompts?speaker=' + speaker);
  if (!r.ok) { $('introNote').textContent = (await r.json()).detail; $('introNote').className = 'note bad'; return; }
  const data = await r.json();
  const more = await (await fetch('/api/record/extras?speaker=' + speaker)).json();
  // Reading lines first, so the questions come after the speaker has settled in.
  const items = [...data.prompts, ...more.prompts.filter(p => p.kind === 'digits'), ...more.prompts.filter(p => p.kind === 'answer')];
  total = items.length;
  queue = items.filter(p => !p.done);
  try {
    // Processing off: the phone channel is applied on the server, and browser noise suppression is not what a call centre hears.
    const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: true, channelCount: 1}});
    ctx = new AudioContext({sampleRate: 24000});
    await ctx.audioWorklet.addModule('capture-worklet.js');
    node = new AudioWorkletNode(ctx, 'capture');
    node.port.onmessage = e => {
      let peak = 0; for (const x of e.data) peak = Math.max(peak, Math.abs(x));
      $('level').value = peak;
      if (recording) chunks.push(e.data);
    };
    ctx.createMediaStreamSource(stream).connect(node);
  } catch (e) { $('introNote').textContent = 'Microphone unavailable: ' + e.message; $('introNote').className = 'note bad'; return; }
  $('intro').hidden = true; $('who').textContent = speaker;
  show();
};

function show() {
  wav = null; $('play').disabled = $('save').disabled = true;
  if (!queue.length) { $('stage').hidden = true; $('done').hidden = false; totals(); return; }
  $('stage').hidden = false;
  $('count').textContent = (total - queue.length + 1) + ' of ' + total;
  const answering = queue[0].kind === 'answer';
  $('say').textContent = queue[0].say; $('say').lang = answering ? 'hi-Latn' : queue[0].lang;
  $('cue').hidden = !answering;
  $('cue').textContent = answering ? `The agent asks you this. You meant ${queue[0].meaning}.` : '';
  say(answering ? 'Do not read the question. Answer it the way you naturally would on a call.' : 'Read it once in your normal voice. Do not slow down for the numbers.');
}

async function totals() {
  const d = await (await fetch('/api/record/prompts?speaker=' + speaker)).json();
  $('totals').textContent = d.clips + ' clips from ' + d.speakers + ' speakers so far.';
}

function encode(blocks) {
  const n = blocks.reduce((a, b) => a + b.length, 0), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 24000, true); v.setUint32(28, 48000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
  let o = 44;
  for (const b of blocks) for (const x of b) { v.setInt16(o, Math.max(-1, Math.min(1, x)) * 32767, true); o += 2; }
  return new Blob([buf], {type: 'audio/wav'});
}

function say(text, bad) { $('note').textContent = text; $('note').className = 'note' + (bad ? ' bad' : ''); }

function toggle() {
  if ($('stage').hidden) return;
  recording = !recording;
  $('rec').textContent = recording ? 'Stop (space)' : 'Record again (space)';
  $('rec').className = 'btn ' + (recording ? 'live' : '');
  if (recording) { chunks = []; wav = null; $('play').disabled = $('save').disabled = true; say('Recording…'); return; }
  // Stopping is instant, so wait for the worklet's last 100 ms block before encoding.
  setTimeout(() => { wav = encode(chunks); $('play').disabled = $('save').disabled = false; $('save').className = 'btn primary'; say('Listen if you like, then save.'); }, 150);
}

async function save() {
  if (!wav || recording) return;
  $('save').disabled = true;
  const p = queue[0];
  const r = await fetch(`/api/record/${speaker}/${p.id}`, {method: 'POST', body: wav, headers: {'content-type': 'audio/wav'}});
  const d = await r.json();
  if (!r.ok) { say(d.detail + '. Record it again.', true); return; }
  say(d.clipped ? 'Saved, but it clipped: move back from the microphone a little.' : 'Saved.', d.clipped);
  queue.shift(); $('rec').textContent = 'Record (space)'; $('rec').className = 'btn primary'; $('save').className = 'btn';
  show();
}

$('rec').onclick = toggle; $('save').onclick = save;
$('play').onclick = () => { if (wav) new Audio(URL.createObjectURL(wav)).play(); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'Enter') { e.preventDefault(); save(); }
});
</script>
</body>
</html>
